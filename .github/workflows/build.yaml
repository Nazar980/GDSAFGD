name: Build

on:
  push:
    branches:
      - '1.21'
      - '1.21.[1-9]'
      - '1.21.1[0-9]'
    
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

                - name: Build Annotation Processor
        run: |
          pushd ./mixin-plugin/annotation-processor
          chmod +x ./gradlew
          ./gradlew build
          popd



      - name: Build Fabric
        run: |
          pushd ./fabric
          chmod +x ./gradlew
          ./gradlew build
          popd

          



      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fabric
          path: ./fabric/build/libs/*.jar
          compression-level: 0
          if-no-files-found: error




